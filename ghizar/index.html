<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SK Mobiles – Staff Product Entry</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#040f1f">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:Poppins;src:url(/assets/fonts/poppins-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Poppins;src:url(/assets/fonts/poppins-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:Poppins;src:url(/assets/fonts/poppins-latin-800-normal.woff2) format("woff2");font-weight:800;font-display:swap}
:root{--navy:#0B2545;--deep:#06162b;--ink:#040f1f;--or:#F26B0F;--or2:#ff8a3d;--tx:#f4f7fb;--mut:#a9bbd1;--line:rgba(255,255,255,.12);--ok:#25D366;--bad:#ff5a5a}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:Poppins,system-ui,sans-serif;background:radial-gradient(1200px 600px at 80% -10%,#123563 0,transparent 60%),var(--ink);color:var(--tx);line-height:1.5;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
header img{height:44px;width:auto;background:#fff;border-radius:12px;padding:6px 10px}
.who{font-size:13px;color:var(--mut);text-align:right}
.who button{background:none;border:0;color:var(--or2);font:inherit;cursor:pointer;padding:0;text-decoration:underline}
.card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.03));border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
h1{font-size:24px;font-weight:800;letter-spacing:-.01em;margin-bottom:4px}
h1 span{color:var(--or)}
.sub{color:var(--mut);font-size:14px;margin-bottom:18px}
label{display:block;font-size:14px;font-weight:600;margin:16px 0 6px}
input[type=text],input[type=password],input[type=number]{width:100%;font:inherit;font-size:16px;color:var(--tx);background:rgba(4,15,31,.6);border:1px solid var(--line);border-radius:14px;padding:13px 14px;outline:none;transition:border-color .2s}
input:focus{border-color:var(--or)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed rgba(242,107,15,.55);border-radius:16px;padding:20px;text-align:center;cursor:pointer;color:var(--mut);font-size:14px;background:rgba(242,107,15,.05)}
.pick b{color:var(--tx);font-size:15px}
.pick input{display:none}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.thumbs div{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:15px;line-height:24px;cursor:pointer}
.btn{display:block;width:100%;margin-top:22px;font:inherit;font-weight:800;font-size:17px;color:#fff;background:linear-gradient(135deg,var(--or),var(--or2));border:0;border-radius:16px;padding:15px;cursor:pointer;box-shadow:0 10px 24px rgba(242,107,15,.35)}
.btn:disabled{opacity:.6;cursor:wait}
.msg{margin-top:14px;font-size:14px;padding:11px 14px;border-radius:12px;display:none}
.msg.ok{display:block;background:rgba(37,211,102,.12);border:1px solid rgba(37,211,102,.4)}
.msg.bad{display:block;background:rgba(255,90,90,.12);border:1px solid rgba(255,90,90,.4)}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
.remember{display:flex;align-items:center;gap:8px;font-weight:400;font-size:14px;color:var(--mut)}
h2{font-size:17px;font-weight:800;margin:30px 0 10px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;font-size:14px;background:rgba(255,255,255,.03)}
.item small{color:var(--mut);display:block}
.tag{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;height:max-content;white-space:nowrap;background:rgba(242,107,15,.15);color:var(--or2)}
.tag.done{background:rgba(37,211,102,.15);color:var(--ok)}
.hide{display:none!important}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:var(--or);transition:width .3s}
</style>
</head>
<body>
<div class="wrap">
 <header>
  <img src="/assets/img/logo.webp" alt="SK Mobiles Repairing Lab" width="375" height="120">
  <div class="who hide" id="who">Logged in as <b id="whoName"></b><br><button type="button" id="logout">Log out</button></div>
 </header>

 <!-- Login -->
 <section class="card" id="loginCard">
  <h1>Staff <span>Login</span></h1>
  <p class="sub">SK Mobiles product entry. Staff only.</p>
  <form id="loginForm" autocomplete="on">
   <label for="u">Username</label>
   <input type="text" id="u" autocomplete="username" autocapitalize="none" required>
   <label for="p">Password</label>
   <input type="password" id="p" autocomplete="current-password" required>
   <label class="remember"><input type="checkbox" id="rem" checked> Keep me logged in on this phone</label>
   <button class="btn" type="submit" id="loginBtn">Log in</button>
   <div class="msg" id="loginMsg"></div>
  </form>
 </section>

 <!-- Add product -->
 <section class="hide" id="app">
  <div class="card">
   <h1>Add <span>New Product</span></h1>
   <p class="sub">Fill all 4 fields, then press Save.</p>
   <form id="addForm">
    <label for="name">1. Product name</label>
    <input type="text" id="name" placeholder="e.g. Anker 20W fast charger, white" maxlength="120" required>

    <label>2. Pictures</label>
    <label class="pick" for="pics"><b>+ Add pictures</b>Camera or gallery, up to 10<input type="file" id="pics" accept="image/*" multiple></label>
    <div class="thumbs" id="thumbs"></div>
    <p class="hint">Take clear photos on a plain background. Front, back and box if you have it.</p>

    <div class="row">
     <div><label for="buy">3. Purchase price (Rs)</label><input type="number" id="buy" inputmode="numeric" min="0" step="1" required></div>
     <div><label for="sell">4. Sale price (Rs)</label><input type="number" id="sell" inputmode="numeric" min="1" step="1" required></div>
    </div>

    <button class="btn" type="submit" id="saveBtn">Save product</button>
    <div class="bar hide" id="bar"><i></i></div>
    <div class="msg" id="addMsg"></div>
   </form>
  </div>

  <h2>Recently added</h2>
  <div class="list" id="list"><p class="sub">Loading…</p></div>
 </section>
</div>

<script>
(function(){
var API='https://script.google.com/macros/s/AKfycbwCPT3M6II1A2MRC0Ep93vask6cOW1hvLs1b1HxB8oSLHPJhnaU_G1O7TGl-K1cKJO7Cw/exec';
var KEY='sk_staff_login';
var cred=null, files=[];
var $=function(id){return document.getElementById(id)};

function store(){try{return window.localStorage}catch(e){return null}}
function show(el,text,ok){el.textContent=text;el.className='msg '+(ok?'ok':'bad')}
function hideMsg(el){el.className='msg'}

function call(body){
 return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
  .then(function(r){return r.json()});
}

function enter(){
 $('loginCard').classList.add('hide');$('app').classList.remove('hide');
 $('who').classList.remove('hide');$('whoName').textContent=cred.user;
 loadRecent();
}

function loadRecent(){
 call({action:'recent',user:cred.user,pass:cred.pass}).then(function(r){
  var box=$('list');box.innerHTML='';
  if(!r.ok||!r.items.length){box.innerHTML='<p class="sub">Nothing added yet.</p>';return}
  r.items.forEach(function(it){
   var d=document.createElement('div');d.className='item';
   var l=document.createElement('div');l.textContent=it.name;
   var s=document.createElement('small');s.textContent=it.id+' · Rs '+it.sale;l.appendChild(s);
   var t=document.createElement('span');t.className='tag'+(it.status==='On Shopify'?' done':'');t.textContent=it.status||'New';
   d.appendChild(l);d.appendChild(t);box.appendChild(d);
  });
 }).catch(function(){$('list').innerHTML='<p class="sub">Could not load list.</p>'});
}

// Auto login
var st=store();
if(st){try{var saved=JSON.parse(st.getItem(KEY)||'null');if(saved&&saved.user){cred=saved;enter()}}catch(e){}}

$('loginForm').addEventListener('submit',function(e){
 e.preventDefault();hideMsg($('loginMsg'));
 var u=$('u').value.trim().toLowerCase(),p=$('p').value;
 $('loginBtn').disabled=true;$('loginBtn').textContent='Checking…';
 call({action:'login',user:u,pass:p}).then(function(r){
  if(!r.ok){show($('loginMsg'),r.error||'Login failed.',false);return}
  cred={user:u,pass:p};
  if($('rem').checked&&st){try{st.setItem(KEY,JSON.stringify(cred))}catch(x){}}
  enter();
 }).catch(function(){show($('loginMsg'),'No internet or server busy. Try again.',false)})
 .finally(function(){$('loginBtn').disabled=false;$('loginBtn').textContent='Log in'});
});

$('logout').addEventListener('click',function(){
 if(st){try{st.removeItem(KEY)}catch(x){}}
 cred=null;location.reload();
});

// Pictures
function drawThumbs(){
 var box=$('thumbs');box.innerHTML='';
 files.forEach(function(f,i){
  var d=document.createElement('div');var im=document.createElement('img');im.src=URL.createObjectURL(f);
  var b=document.createElement('button');b.type='button';b.textContent='×';b.setAttribute('aria-label','Remove picture');
  b.onclick=function(){files.splice(i,1);drawThumbs()};
  d.appendChild(im);d.appendChild(b);box.appendChild(d);
 });
}
$('pics').addEventListener('change',function(){
 Array.prototype.forEach.call(this.files,function(f){if(files.length<10&&/^image\//.test(f.type))files.push(f)});
 this.value='';drawThumbs();
});

// Shrink photo to max 1800px JPEG so upload is fast on mobile data
function shrink(file){
 return new Promise(function(res,rej){
  var img=new Image();
  img.onload=function(){
   var max=1800,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));
   var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
   var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
   URL.revokeObjectURL(img.src);
   res({mime:'image/jpeg',data:c.toDataURL('image/jpeg',0.88).split(',')[1]});
  };
  img.onerror=function(){rej(new Error('bad image'))};
  img.src=URL.createObjectURL(file);
 });
}

$('addForm').addEventListener('submit',function(e){
 e.preventDefault();var m=$('addMsg');hideMsg(m);
 var name=$('name').value.trim(),buy=$('buy').value,sell=$('sell').value;
 if(!name){show(m,'Write the product name.',false);return}
 if(!files.length){show(m,'Add at least one picture.',false);return}
 if(buy===''||sell===''){show(m,'Write both prices.',false);return}
 if(Number(sell)<Number(buy)&&!confirmLow()){return}
 var btn=$('saveBtn'),bar=$('bar'),fill=bar.firstChild;
 btn.disabled=true;btn.textContent='Saving…';bar.classList.remove('hide');fill.style.width='10%';
 var done=0;
 Promise.all(files.map(function(f){return shrink(f).then(function(r){done++;fill.style.width=(10+60*done/files.length)+'%';return r})}))
 .then(function(imgs){
  fill.style.width='80%';
  return call({action:'add',user:cred.user,pass:cred.pass,name:name,purchase:Number(buy),sale:Number(sell),images:imgs});
 })
 .then(function(r){
  fill.style.width='100%';
  if(!r.ok){show(m,r.error||'Could not save.',false);return}
  show(m,'Saved ✓ '+r.id+'. Add the next product.',true);
  $('addForm').reset();files=[];drawThumbs();loadRecent();window.scrollTo({top:0,behavior:'smooth'});
 })
 .catch(function(){show(m,'Upload failed. Check internet and try again.',false)})
 .finally(function(){btn.disabled=false;btn.textContent='Save product';setTimeout(function(){bar.classList.add('hide');fill.style.width='0'},600)});
});

var lowWarned=false;
function confirmLow(){
 if(lowWarned){lowWarned=false;return true}
 lowWarned=true;show($('addMsg'),'Sale price is lower than purchase price. Check it. Press Save again if it is correct.',false);
 return false;
}
})();
</script>
</body>
</html>
